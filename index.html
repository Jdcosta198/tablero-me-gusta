<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a3cf3e">
<title>Tablero Me Gusta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: inicio (frases) → opciones → actividad (reproductor, música, lienzo). Seña LESCO aparece encima al tocar. */
:root{
  --bg:#eef6e3;
  --band:#a3cf3e;
  --band-ink:#18240c;
  --card:#ffffff;
  --card-edge:#b8dc79;
  --leaf:#3f7a12;
  --ink:#1d2b38;
  --muted:#5b6f82;
  --heart:#e2566f;
  --active:#ffd84d;
  --go:#e23d3d;
  --go-ink:#ffffff;
  --scrim:rgba(10,20,5,.72);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a0c;--band:#7fae24;--band-ink:#0f1708;--card:#1d2a14;--card-edge:#3d5a22;--leaf:#a8d860;
  --ink:#eef4e6;--muted:#a9b99a;--heart:#f07a8e;--active:#e8c23a;--go:#e04848;--go-ink:#ffffff;--scrim:rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a0c;--band:#7fae24;--band-ink:#0f1708;--card:#1d2a14;--card-edge:#3d5a22;--leaf:#a8d860;
  --ink:#eef4e6;--muted:#a9b99a;--heart:#f07a8e;--active:#e8c23a;--go:#e04848;--go-ink:#ffffff;--scrim:rgba(0,0,0,.8);color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;
  padding-block:14px 18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--band);color:var(--band-ink);border-radius:22px;
  display:flex;align-items:center;gap:12px;padding:10px 14px}
header h1{margin:0;flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,6vw,3.1rem);line-height:1.05;text-wrap:balance}
.heart{width:clamp(36px,7vw,56px);flex:none}
.hbtn{flex:none;font:800 1.2rem var(--body);background:var(--card);color:var(--ink);border:0;border-radius:16px;
  padding:14px 18px;cursor:pointer}
.gear{font-size:1.3rem;padding:8px 10px;background:transparent;color:var(--band-ink);opacity:.55;position:relative;overflow:hidden}
.gear .fill{position:absolute;inset:auto 0 0 0;height:0;background:var(--card);opacity:.6;transition:height 0s}
.gear.holding .fill{height:100%;transition:height 1.5s linear}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:4px solid var(--active);outline-offset:3px}

.grid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
@media (min-width:820px){.grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}}

.card{background:var(--card);border:4px solid var(--card-edge);border-radius:22px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 8px;min-height:150px;cursor:pointer;font:inherit;position:relative;
  transition:transform .12s ease,border-color .12s ease,background .12s ease}
.card .pic{font-size:clamp(3.4rem,13vw,6.5rem);line-height:1}
.card img.pic{width:clamp(110px,26vw,190px);height:auto;border-radius:12px;background:#fff}
.card .word{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4.4vw,2.1rem);line-height:1.1;text-align:center}
.card.starter{border-color:var(--band)}
.card.starter::after,.card.has-action::after{content:"›";position:absolute;right:14px;top:6px;font:800 2rem var(--display);color:var(--leaf)}
.card .lesco{position:absolute;left:10px;top:8px;font-size:1.5rem}
.card.speaking{border-color:var(--active);background:color-mix(in srgb,var(--active) 22%,var(--card));transform:scale(.97)}

.said{background:var(--card);border:3px dashed var(--card-edge);border-radius:18px;
  min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.said p{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,4.5vw,2rem);min-width:0}
.said p .obj{color:var(--leaf)}
.said p.empty{color:var(--muted);font-family:var(--body);font-weight:400;font-size:1.05rem}
.again{flex:none;font:700 1.05rem var(--body);background:var(--band);color:var(--band-ink);border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
.again:disabled{opacity:.4}
.note{margin:0;color:var(--muted);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:1rem;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* Actividad */
.action{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  background:var(--card);border:4px solid var(--card-edge);border-radius:26px;padding:18px 14px;min-height:0}
.action .big{font-size:clamp(6rem,24vw,11rem);line-height:1}
.action img.big{width:clamp(180px,42vw,300px);height:auto;border-radius:18px;background:#fff}
.action h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1}
.action .sub{margin:0;color:var(--muted);font-size:1.05rem;max-width:44ch}
.screen{width:100%;max-height:68vh;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:18px;overflow:hidden;display:flex}
.screen video,.screen iframe{width:100%;height:100%;border:0;display:block;background:#000}
.ctl{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.bigbtn{display:inline-flex;align-items:center;gap:12px;text-decoration:none;background:var(--go);color:var(--go-ink);border:0;cursor:pointer;
  font:800 clamp(1.4rem,5vw,2rem) var(--display);border-radius:999px;padding:14px 34px;box-shadow:0 6px 0 color-mix(in srgb,var(--go) 60%,#000)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--go) 60%,#000)}
.bigbtn.calm{background:var(--band);color:var(--band-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--band) 55%,#000)}
.otro{font:700 1.1rem var(--body);background:transparent;color:var(--leaf);border:3px solid var(--leaf);border-radius:999px;padding:12px 24px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.musicpic{position:relative;border-radius:50%;padding:18px}
.musicpic img{width:clamp(170px,40vw,280px);height:auto;border-radius:50%;background:#fff;display:block}
.musicpic.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--band) 70%,transparent)}50%{box-shadow:0 0 0 22px color-mix(in srgb,var(--band) 0%,transparent)}}

/* Lienzo */
.paint{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatch{width:54px;height:54px;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 2px var(--card-edge);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 5px var(--ink);transform:scale(1.08)}
.tool{min-width:56px;height:56px;border-radius:16px;border:3px solid var(--card-edge);background:var(--card);color:var(--ink);
  font:800 1.05rem var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.tool[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in srgb,var(--band) 25%,var(--card))}
.dot{display:inline-block;border-radius:50%;background:var(--ink)}
.sep{width:2px;align-self:stretch;background:var(--card-edge);border-radius:2px}
.canvasBox{flex:1;min-height:340px;border-radius:22px;border:4px solid var(--card-edge);overflow:hidden;background:#fff;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* Seña LESCO */
.signLayer{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.signCard{background:var(--card);border-radius:26px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;max-height:100%;box-sizing:border-box}
.signCard .tag{font:800 1rem var(--body);letter-spacing:.06em;color:var(--leaf)}
.signCard video{width:100%;max-height:55vh;border-radius:18px;background:#000;display:block}
.signCard .w{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1}

/* Ajustes */
.settings{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--card);border:4px solid var(--card-edge);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;user-select:text;-webkit-user-select:text}
.panel h2{margin:0;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.panel .help{margin:0;color:var(--muted);font-size:.98rem;max-width:65ch}
.panel .help a{color:var(--leaf);font-weight:700}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:start;padding-top:12px;border-top:2px solid var(--card-edge)}
.act img{width:64px;height:auto;border-radius:10px;grid-row:span 3;background:#fff}
.act b{font-size:1.15rem}
.act input[type=url]{font:400 1rem var(--body);padding:12px;border-radius:12px;border:2px solid var(--card-edge);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.filebtn{display:inline-flex;align-items:center;gap:8px;font:700 1rem var(--body);background:var(--band);color:var(--band-ink);border-radius:12px;padding:10px 14px;cursor:pointer;position:relative}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.mini{font:700 .95rem var(--body);background:transparent;color:var(--ink);border:2px solid var(--card-edge);border-radius:10px;padding:8px 12px;cursor:pointer}
.status{font-size:.95rem;color:var(--muted)}
.status.ok{color:var(--leaf);font-weight:700}
.rowline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sign{display:flex;flex-direction:column;gap:8px;border:2px solid var(--card-edge);border-radius:14px;padding:10px}
.sign .h{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.sign .h .e{font-size:1.8rem;line-height:1}
.sign .h img{width:40px;height:auto;border-radius:8px;background:#fff}
.check{display:flex;gap:12px;align-items:center;font-size:1.05rem}
.check input{width:26px;height:26px;accent-color:var(--leaf);flex:none}
@media (prefers-reduced-motion:reduce){.card,.swatch{transition:none}.card.speaking{transform:none}.musicpic.on{animation:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}body{margin:0;font-size:14px}</style>
</head>
<body>


<div class="wrap">
  <header>
    <button class="hbtn" id="back" hidden aria-label="Volver">‹ Volver</button>
    <h1 id="title">¿Qué quiero decir?</h1>
    <svg class="heart" id="heart" viewBox="0 0 48 44" aria-hidden="true"><path fill="var(--heart)" stroke="var(--ink)" stroke-width="3" d="M24 41S3 28 3 14A10.5 10.5 0 0 1 24 8a10.5 10.5 0 0 1 21 6c0 14-21 27-21 27z"/></svg>
    <button class="hbtn gear" id="gear" aria-label="Ajustes del cuidador: mantener presionado"><span class="fill"></span>⚙️</button>
  </header>

  <main id="view" class="grid"></main>

  <div class="said" id="strip">
    <p id="said" class="empty">Toca una frase para empezar.</p>
    <button class="again" id="again" disabled>🔊 Decir frase</button>
  </div>
  <p class="note" id="note" hidden></p>
</div>

<div class="signLayer" id="signLayer" hidden>
  <div class="signCard" role="dialog" aria-label="Seña en LESCO">
    <span class="tag">🤟 LESCO</span>
    <video id="signVid" playsinline muted></video>
    <span class="w" id="signWord"></span>
    <div class="ctl">
      <button class="otro" id="signAgain">🔁 Otra vez</button>
      <button class="bigbtn calm" id="signGo">Seguir ›</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

    {pic:"👍", word:"Sí",         say:"Sí"},
    {pic:"👎", word:"No",         say:"No"},
    {pic:"🙏", word:"Por favor",  say:"Por favor"},
    {pic:"💛", word:"Gracias",    say:"Gracias"},
    {pic:"🛑", word:"Ya terminé", say:"Ya terminé"},
    {pic:"🔁", word:"Otra vez",   say:"Otra vez"},
  ]},
];
const LESCO_DICT = "https://www.handsonlesco.com/diccionario/";

/* ---------- Guardado en este dispositivo ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
/* Archivos (videos de señas, videos y canciones) en IndexedDB */
const DB = (()=>{
  let p;
  function open(){
    if(!p) p = new Promise((res,rej)=>{ try{
      const r = indexedDB.open("tablero-me-gusta",1);
      r.onupgradeneeded = ()=> r.result.createObjectStore("files");
      r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
    }catch(e){ rej(e); } });
    return p;
  }
  async function tx(mode, fn){
    const db = await open();
    return new Promise((res,rej)=>{ const t=db.transaction("files",mode); const r=fn(t.objectStore("files"));
      t.oncomplete=()=>res(r && r.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
  }
  return {
    get: k => tx("readonly", s=>s.get(k)).catch(()=>null),
    set: (k,v) => tx("readwrite", s=>s.put(v,k)),
    del: k => tx("readwrite", s=>s.delete(k)).catch(()=>null),
    keys: () => tx("readonly", s=>s.getAllKeys()).catch(()=>[]),
  };
})();
let links = Object.assign({}, DEFAULT_LINKS, store.get("links",{}));
let opts  = Object.assign({fullPhrase:true, autoAction:true, lesco:true, autoReturn:true}, store.get("opts",{}));
let saved = new Set();          /* claves de archivos guardados: "sign:…", "media:…" */

/* ---------- Voz ---------- */
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
let voice = null, phrase = "", backTo = null, leaving = [];
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices();
  for(const tag of ["es-cr","es-mx","es-us","es-419","es-co","es-es","es"]){
    const v = vs.find(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith(tag));
    if(v){ voice = v; return; }
  }
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
else { $("note").hidden=false; $("note").textContent="Este navegador no puede leer en voz alta. Abrilo en Chrome (Android) o Safari (iPhone/iPad)."; }
function speak(parts, el, after){
  document.querySelectorAll(".card.speaking").forEach(c=>c.classList.remove("speaking"));
  if(el) el.classList.add("speaking");
  let finished = false;
  const done = ()=>{ if(finished) return; finished=true; el && el.classList.remove("speaking"); after && after(); };
  if(!synth){ setTimeout(done,700); return; }
  synth.cancel();
  parts.forEach((p,i)=>{
    const u = new SpeechSynthesisUtterance(p);
    u.lang = voice ? voice.lang : "es-MX"; if(voice) u.voice = voice;
    u.rate = 0.85; u.pitch = 1.05;
    if(i===parts.length-1) u.onend = u.onerror = done;
    synth.speak(u);
  });
  setTimeout(done, 1600*parts.length + 600);
}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

/* Evita toques dobles por accidente */
let lockUntil = 0;
const tapOk = ()=>{ const n=Date.now(); if(n<lockUntil) return false; lockUntil=n+700; return true; };

/* ---------- Estructura de pantallas ---------- */
function setHeader(title, back, heart){
  $("title").textContent = title;
  $("back").hidden = !back; backTo = back || null;
  $("heart").style.display = heart ? "" : "none";
}
function setStrip(start, obj){
  const s = $("said");
  if(!start && !obj){ s.className="empty"; s.textContent="Toca una frase para empezar."; return; }
  s.className=""; s.innerHTML="";
  if(start) s.append(start + (obj?" ":"…"));
  if(obj){ const b=document.createElement("span"); b.className="obj"; b.textContent=obj; s.append(b); }
}
function freshView(cls, strip=true){
  leaving.forEach(f=>{ try{f()}catch(e){} }); leaving=[];
  const v=$("view"); v.className=cls; v.innerHTML=""; $("strip").hidden=!strip; window.scrollTo(0,0); return v;
}
function artHTML(pic, cls){
  return pic.startsWith("data:") ? `<img class="${cls}" src="${pic}" alt="">` : `<span class="${cls}" aria-hidden="true">${pic}</span>`;
}
function card(pic, word, cls, id, signKey){
  const c = document.createElement("button");
  c.className = "card" + (cls?" "+cls:""); c.id = id;
  c.innerHTML = artHTML(pic,"pic") + `<span class="word">${word}</span>` +
    (opts.lesco && saved.has(signKey) ? `<span class="lesco" title="Tiene seña LESCO">🤟</span>` : "");
  return c;
}

/* ---------- Seña LESCO ---------- */
let signNext = null, signUrl = null;
async function showSign(key, word, next){
  const blob = await DB.get(key);
  if(!blob){ next && next(); return; }
  if(signUrl) URL.revokeObjectURL(signUrl);
  signUrl = URL.createObjectURL(blob);
  const v = $("signVid"); v.src = signUrl;
  $("signWord").textContent = word; signNext = next;
  $("signLayer").hidden = false;
  v.play().catch(()=>{});
}
function closeSign(go){
  const v=$("signVid"); v.pause(); $("signLayer").hidden = true;
  const n = signNext; signNext = null; if(go && n) n();
}
$("signVid").onended = ()=> setTimeout(()=>{ if(!$("signLayer").hidden) closeSign(true); }, 900);
$("signAgain").onclick = ()=>{ const v=$("signVid"); v.currentTime=0; v.play().catch(()=>{}); };
$("signGo").onclick = ()=> closeSign(true);

/* ---------- Inicio y tableros ---------- */
function renderHome(){
  setHeader("¿Qué quiero decir?", null, true);
  setStrip(); phrase=""; $("again").disabled=true;
  const g = freshView("grid cols3");
  BOARDS.forEach(b=>{
    const key = "sign:start-"+b.id;
    const c = card(b.pic, b.label, "starter", "start-"+b.id, key);
    c.addEventListener("click", ()=>{
      if(!tapOk()) return;
      speak([b.label], c);
      b.standalone ? setStrip() : setStrip(b.label,"");
      const go = ()=>renderBoard(b.id);
      if(opts.lesco && saved.has(key)) showSign(key, b.label, go); else setTimeout(go, 300);
    });
    g.appendChild(c);
  });
}

function renderBoard(id){
  const b = BOARDS.find(x=>x.id===id);
  setHeader(b.title, renderHome, id==="gusta");
  const g = freshView("grid" + (b.items.length>4?" cols3":""));
  b.items.forEach((it,i)=>{
    const key = `sign:${b.id}-${i}`;
    const c = card(it.pic, it.word, it.action && opts.autoAction ? "has-action" : "", `card-${b.id}-${i}`, key);
    c.addEventListener("click", ()=>{
      if(!tapOk()) return;
      let parts, next = null;
      if(b.standalone){ phrase=it.say; setStrip("",it.say); parts=[it.say]; }
      else {
        phrase = b.label+" "+it.say; setStrip(b.label, it.say);
        parts = opts.fullPhrase ? [cap(it.say), phrase] : [cap(it.say)];
        if(it.action && opts.autoAction) next = ()=> renderAction(it.action, ()=>renderBoard(id));
      }
      $("again").disabled=false;
      if(opts.lesco && saved.has(key)){ speak(parts, c); showSign(key, it.word, next); }
      else speak(parts, c, next);
    });
    g.appendChild(c);
  });
}

/* ---------- Actividades ---------- */
function ytId(u){ const m=String(u||"").match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/); return m?m[1]:null; }

async function renderAction(key, back){
  const a = ACTIONS[key];
  if(a.type==="paint") return renderPaint(back);
  setHeader(a.title, back, false);
  const v = freshView("action", false);
  speak([a.sayGo]);
  const file = await DB.get("media:"+key);
  const pic = PICS[key];

  if(file){                                    /* 1) Archivo guardado en la tablet: se reproduce aquí mismo */
    const url = URL.createObjectURL(file);
    leaving.push(()=>URL.revokeObjectURL(url));
    const isAudio = (file.type||"").startsWith("audio");
    v.innerHTML = isAudio
      ? `<div class="musicpic" id="mp">${pic?`<img src="${pic}" alt="">`:`<span class="big">${a.big}</span>`}</div>
         <h2>${a.sub}</h2><audio id="media" src="${url}"></audio>`
      : `<div class="screen"><video id="media" src="${url}" playsinline></video></div>`;
    v.insertAdjacentHTML("beforeend", `<div class="ctl">
        <button class="bigbtn" id="pp">▶ Play</button>
        ${isAudio?"":`<button class="otro" id="fs">⛶ Pantalla completa</button>`}
        <button class="otro" id="act-back">‹ Terminé</button></div>`);
    const m = $("media"), pp = $("pp");
    const sync = ()=>{ const on=!m.paused; pp.textContent = on ? "⏸ Pausa" : "▶ Play"; const mp=$("mp"); if(mp) mp.classList.toggle("on",on); };
    m.onplay = m.onpause = sync;
    m.onended = ()=>{ sync(); if(opts.autoReturn) setTimeout(()=>{ if(document.body.contains(m)) back(); }, 2500); };
    pp.onclick = ()=> m.paused ? m.play().catch(()=>{}) : m.pause();
    if($("fs")) $("fs").onclick = ()=>{ try{ (m.requestFullscreen||m.webkitEnterFullscreen||m.webkitRequestFullscreen).call(m); }catch(e){} };
    leaving.push(()=>{ m.pause(); m.removeAttribute("src"); });
    setTimeout(()=>{ if(document.body.contains(m)) m.play().catch(()=>{}); }, 1600);
  }
  else if(ytId(links[key])){                   /* 2) Enlace exacto de YouTube: se intenta ver aquí mismo */
    const id = ytId(links[key]);
    v.innerHTML = `<div class="screen" id="scr"><iframe id="yt" title="${a.sub}"
        src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
      <div class="ctl"><button class="otro" id="act-back">‹ Terminé</button>
      <a class="otro" href="${links[key]}" target="_blank" rel="noopener">Abrir en YouTube</a></div>`;
    const blocked = e=>{ if(String(e.blockedURI||"").includes("youtube")) linkView(v,a,key,pic); };
    document.addEventListener("securitypolicyviolation", blocked);
    leaving.push(()=>document.removeEventListener("securitypolicyviolation", blocked));
  }
  else linkView(v,a,key,pic);                  /* 3) Sin video guardado: botón a YouTube */
  const ab = $("act-back"); if(ab) ab.onclick = back;
}
function linkView(v,a,key,pic){
  v.innerHTML = `${pic?`<img class="big" src="${pic}" alt="">`:`<div class="big" aria-hidden="true">${a.big}</div>`}
    <h2>${a.title}</h2>
    <a class="bigbtn" href="${links[key]}" target="_blank" rel="noopener">▶ ${a.go}</a>
    <p class="sub">${a.sub}. Se abre en YouTube. Para verlo aquí mismo, el cuidador puede guardar el video en ⚙️ Ajustes.</p>
    <button class="otro" id="act-back2">‹ Elegir otra cosa</button>`;
  $("act-back2").onclick = ()=> backTo && backTo();
}

/* ---------- Pintura ---------- */
const COLORS = ["#1d1d1d","#e23d3d","#ff8a1f","#ffd21f","#2fb34a","#2f8fd3","#7b4ae2","#ff6fb1","#8b5a2b"];
function renderPaint(back){
  setHeader("¡A pintar!", back, false);
  const v = freshView("paint", false);
  speak(["Vamos a pintar"]);
  v.innerHTML = `<div class="tools" id="tools"></div>
    <div class="canvasBox" id="box"><canvas id="cv" aria-label="Lienzo para pintar con el dedo"></canvas></div>`;
  const tools = $("tools"), cv = $("cv"), box = $("box"), ctx = cv.getContext("2d");
  let color = COLORS[1], size = 20, erase = false, history = [], drawing = false, last = null;
  COLORS.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="swatch"; b.id="sw"+i; b.style.background=c;
    b.setAttribute("aria-label","Color"); b.onclick=()=>{ color=c; erase=false; refresh(); }; tools.appendChild(b);
  });
  tools.insertAdjacentHTML("beforeend", `<span class="sep"></span>`);
  [[8,"Fino"],[20,"Medio"],[40,"Grueso"]].forEach(([s,n])=>{
    const b=document.createElement("button"); b.className="tool size"; b.dataset.s=s; b.setAttribute("aria-label",n);
    b.innerHTML=`<span class="dot" style="width:${Math.round(s*.65)}px;height:${Math.round(s*.65)}px"></span>`;
    b.onclick=()=>{ size=s; refresh(); }; tools.appendChild(b);
  });
  tools.insertAdjacentHTML("beforeend", `<span class="sep"></span>
    <button class="tool" id="t-erase">🧽 Borrar</button>
    <button class="tool" id="t-undo">↩️ Deshacer</button>
    <button class="tool" id="t-clear">🗑️ Hoja nueva</button>`);
  function refresh(){
    tools.querySelectorAll(".swatch").forEach((b,i)=>b.setAttribute("aria-pressed", !erase && COLORS[i]===color));
    tools.querySelectorAll(".size").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.s===size));
    $("t-erase").setAttribute("aria-pressed", erase);
  }
  refresh();
  function fit(){
    const r = box.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
    const snap = cv.width>1 ? cv.toDataURL() : null;
    cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#fff"; ctx.fillRect(0,0,r.width,r.height);
    if(snap){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=snap; }
  }
  fit(); window.addEventListener("resize", fit); leaving.push(()=>window.removeEventListener("resize", fit));
  const pos = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  function line(a,b){
    ctx.strokeStyle = erase ? "#fff" : color; ctx.lineWidth = erase ? size*1.6 : size;
    ctx.lineCap="round"; ctx.lineJoin="round"; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  cv.addEventListener("pointerdown", e=>{
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    history.push(ctx.getImageData(0,0,cv.width,cv.height)); if(history.length>25) history.shift();
    drawing=true; last=pos(e); line(last,{x:last.x+.1,y:last.y+.1});
  });
  cv.addEventListener("pointermove", e=>{ if(!drawing) return; const p=pos(e); line(last,p); last=p; });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>cv.addEventListener(t,()=>drawing=false));
  $("t-erase").onclick=()=>{ erase=!erase; refresh(); };
  $("t-undo").onclick=()=>{ const h=history.pop(); if(h){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.putImageData(h,0,0); ctx.restore(); } };
  let armed=false;
  $("t-clear").onclick=()=>{
    const b=$("t-clear");
    if(!armed){ armed=true; b.textContent="¿Seguro? Toca otra vez"; setTimeout(()=>{ armed=false; if(document.body.contains(b)) b.textContent="🗑️ Hoja nueva"; },2500); return; }
    history.push(ctx.getImageData(0,0,cv.width,cv.height));
    const r=box.getBoundingClientRect(); ctx.fillStyle="#fff"; ctx.fillRect(0,0,r.width,r.height);
    armed=false; b.textContent="🗑️ Hoja nueva";
  };
}

/* ---------- Ajustes del cuidador ---------- */
function rowParts(key){
  if(key.startsWith("sign:")) return ["video/*","🎥 Grabar o elegir"];
  return key==="media:musica" ? ["audio/*,video/*","🎵 Elegir canción"] : ["video/*,audio/*","🎬 Elegir video"];
}
function fileRow(key){
  const has = saved.has(key), [accept,labelPick] = rowParts(key);
  return `<div class="rowline" data-key="${key}">
      <label class="filebtn">${has?"🔄 Cambiar":labelPick}<input type="file" accept="${accept}" data-key="${key}"></label>
      ${has?`<button class="mini" data-test="${key}">▶ Probar</button><button class="mini" data-del="${key}">Quitar</button>`:""}
      <span class="status ${has?"ok":""}">${has?"✓ Guardado en esta tablet":"Sin archivo"}</span></div>`;
}
function renderSettings(){
  setHeader("Ajustes", renderHome, false);
  const v = freshView("settings", false);
  const signItems = [];
  BOARDS.forEach(b=>{
    signItems.push({key:"sign:start-"+b.id, pic:b.pic, word:b.label});
    b.items.forEach((it,i)=> signItems.push({key:`sign:${b.id}-${i}`, pic:it.pic, word:it.word}));
  });
  v.innerHTML = `
  <section class="panel">
    <h2>🎬 Videos y música dentro de la app</h2>
    <p class="help">La forma más segura de que el video se vea aquí mismo, sin salir de la app, es elegir un video o una canción que ya esté guardado en esta tablet. También puedes pegar el enlace exacto de un video de YouTube: se intenta reproducir aquí, y si el navegador no lo permite aparece el botón para abrir YouTube.</p>
    ${["tv","musica","bailar"].map(k=>`
      <div class="act">
        <img src="${PICS[k]}" alt="">
        <b>${ACTIONS[k].title.replace(/[¡!]/g,"")} · ${ACTIONS[k].sub}</b>
        ${fileRow("media:"+k)}
        <input type="url" id="l-${k}" placeholder="o pega el enlace de YouTube (https://youtube.com/watch?v=…)" value="${links[k]===DEFAULT_LINKS[k]?"":links[k]}">
      </div>`).join("")}
  </section>

  <section class="panel">
    <h2>🤟 LESCO</h2>
    <label class="check" for="o-lesco"><input type="checkbox" id="o-lesco"> Mostrar la seña en LESCO al tocar cada imagen</label>
    <p class="help">Graba la seña de cada palabra con la cámara de la tablet (o elige un video de la galería). Así la persona ve la seña hecha por alguien que conoce, al mismo tiempo que escucha la palabra. Para consultar cómo se hace cada seña puedes usar el <a href="${LESCO_DICT}" target="_blank" rel="noopener">diccionario gratuito de Hands On LESCO</a>.</p>
    <div class="signs">
      ${signItems.map(s=>`<div class="sign"><div class="h">${artHTML(s.pic,"e")}<span>${s.word}</span></div>${fileRow(s.key)}</div>`).join("")}
    </div>
  </section>

  <section class="panel">
    <h2>🔊 Voz y comportamiento</h2>
    <label class="check" for="o-full"><input type="checkbox" id="o-full"> Después de la palabra, decir la frase completa</label>
    <label class="check" for="o-auto"><input type="checkbox" id="o-auto"> Al tocar algo de "Me gusta", ir a la actividad</label>
    <label class="check" for="o-ret"><input type="checkbox" id="o-ret"> Volver solo al tablero cuando termina el video o la canción</label>
    <p class="help">Todo se guarda solo en este dispositivo. Para abrir estos ajustes hay que mantener presionado ⚙️, así la persona no entra por accidente.</p>
  </section>`;

  const o = {"o-full":"fullPhrase","o-auto":"autoAction","o-lesco":"lesco","o-ret":"autoReturn"};
  for(const [id,k] of Object.entries(o)){ $(id).checked = opts[k]; $(id).onchange = e=>{ opts[k]=e.target.checked; store.set("opts",opts); }; }
  ["tv","musica","bailar"].forEach(k=>{
    $("l-"+k).onchange = e=>{
      const val = e.target.value.trim();
      if(val && !/^https?:\/\//i.test(val)){ toast("El enlace debe empezar con https://"); return; }
      const custom = store.get("links",{}); if(val) custom[k]=val; else delete custom[k];
      store.set("links",custom); links = Object.assign({}, DEFAULT_LINKS, custom);
      toast(val ? (ytId(val)?"Enlace guardado":"Guardado, pero no parece un video de YouTube") : "Se usará la búsqueda en YouTube");
    };
  });
  v.addEventListener("change", async e=>{
    const inp = e.target; if(inp.type!=="file" || !inp.files[0]) return;
    const f = inp.files[0], key = inp.dataset.key;
    try{ await DB.set(key, f); saved.add(key); toast("Guardado: "+f.name); refreshRow(key); }
    catch(err){ toast("No se pudo guardar. Puede que la tablet no tenga espacio."); }
  });
  v.addEventListener("click", async e=>{
    const t = e.target.closest("button"); if(!t) return;
    if(t.dataset.del){ const k=t.dataset.del; await DB.del(k); saved.delete(k); refreshRow(k); toast("Quitado"); }
    if(t.dataset.test){
      const k=t.dataset.test;
      if(k.startsWith("sign:")) showSign(k, t.closest(".sign").querySelector(".h span").textContent, null);
      else renderAction(k.slice(6), renderSettings);
    }
  });
  function refreshRow(key){
    const row = v.querySelector(`.rowline[data-key="${CSS.escape(key)}"]`);
    if(row) row.outerHTML = fileRow(key);
  }
}

/* Engranaje: mantener presionado 1.5 s */
(()=>{
  const g=$("gear"); let h=null;
  const start=e=>{ e.preventDefault(); g.classList.add("holding"); h=setTimeout(()=>{ g.classList.remove("holding"); h=null; renderSettings(); },1500); };
  const stop=()=>{ if(h){ clearTimeout(h); h=null; g.classList.remove("holding"); toast("Ajustes: mantén presionado ⚙️"); } };
  g.addEventListener("pointerdown",start); g.addEventListener("pointerup",stop);
  g.addEventListener("pointerleave",()=>{ if(h){clearTimeout(h);h=null;g.classList.remove("holding");} });
  g.addEventListener("contextmenu",e=>e.preventDefault());
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); renderSettings(); } });
})();

$("back").onclick = ()=>{ if(!tapOk()) return; backTo && backTo(); };
$("again").onclick = ()=> phrase && speak([phrase]);
renderHome();
DB.keys().then(k=>{ saved = new Set(k||[]); if(saved.size) renderHome(); });
</script>
